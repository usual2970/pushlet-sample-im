<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sample-im — sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<main>
  <h1>sample-im</h1>
  <div id="error" hidden></div>

  <form id="login-form" class="active" autocomplete="on">
    <h2>Sign in</h2>
    <label>Username
      <input name="username" autocomplete="username" required
             pattern="[A-Za-z0-9_-]{1,32}"
             title="Letters, digits, '-' and '_', at most 32 characters">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
    <p class="switch">No account yet? <a href="#" id="to-register">Create one</a></p>
  </form>

  <form id="register-form">
    <h2>Create account</h2>
    <label>Username
      <input name="username" autocomplete="username" required
             pattern="[A-Za-z0-9_-]{1,32}"
             title="Letters, digits, '-' and '_', at most 32 characters">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
    <p class="switch">Already registered? <a href="#" id="to-login">Sign in</a></p>
  </form>
</main>

<script>
'use strict';

const errorBox = document.getElementById('error');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');

function showError(message) {
  errorBox.textContent = message;
  errorBox.hidden = false;
}

function toggle(show, hide) {
  show.classList.add('active');
  hide.classList.remove('active');
  errorBox.hidden = true;
}

document.getElementById('to-register').addEventListener('click', () => toggle(registerForm, loginForm));
document.getElementById('to-login').addEventListener('click', () => toggle(loginForm, registerForm));

function wire(form, path) {
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.hidden = true;
    const username = form.elements.username.value.trim();
    const password = form.elements.password.value;
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
      });
      if (res.ok) {
        window.location.href = '/chat';
        return;
      }
      let message = 'request failed with status ' + res.status;
      try { message = (await res.json()).error || message; } catch (_) { /* non-JSON body */ }
      showError(message);
    } catch (err) {
      showError('network error: ' + err);
    }
  });
}

wire(loginForm, '/api/login');
wire(registerForm, '/api/register');
</script>
</body>
</html>
