<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sample-im — chat · a pushlet demo messenger</title>
<meta name="description" content="sample-im chat — a demo messenger built on pushlet. Room chat and direct messages stream live to everyone online over SSE.">
<link rel="canonical" href="https://pushlet-sample.ikit.fun/">
<meta property="og:title" content="sample-im — chat · a pushlet demo messenger">
<meta property="og:description" content="sample-im chat — a demo messenger built on pushlet. Room chat and direct messages stream live over SSE.">
<meta property="og:url" content="https://pushlet-sample.ikit.fun/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#2f6fed">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat">
<div id="conn-banner" role="status" hidden>reconnecting…</div>
<header class="chat-header">
  <h1>sample-im <span class="room-name">#room</span> <a class="pushlet-link" href="https://github.com/usual2970/pushlet" target="_blank" rel="noopener">pushlet ↗</a></h1>
  <div class="user-box">
    <span id="me">{{.Username}}</span>
    <button id="logout" type="button">Log out</button>
  </div>
</header>
<!-- The room chat and direct messages are exclusive views behind this tab
     bar; app.js starts on Room and toggles the .active class (plus
     aria-selected) on both the tab and its view. Both SSE streams stay
     connected on either tab; the inactive one collects unread markers:
     a dot on Room for unseen room messages, a count on DMs summing every
     conversation's unread. -->
<div class="tabs" role="tablist" aria-label="Chat views">
  <button id="tab-room" class="tab active" type="button" role="tab"
          aria-selected="true" aria-controls="view-room">Room<span id="room-unread" class="tab-dot" hidden></span></button>
  <button id="tab-dm" class="tab" type="button" role="tab"
          aria-selected="false" aria-controls="view-dm">DMs<span id="dm-unread" class="badge" hidden></span></button>
  <!-- Mobile-only (under 720px, via style.css): turns the online sidebar
       into an off-canvas drawer. The count badge mirrors the online list.
       Hidden on desktop; not a real tab, hence no role=tab. -->
  <button id="online-toggle" class="tab" type="button" aria-expanded="false"
          aria-controls="online">Online<span id="online-count" class="badge" hidden></span></button>
</div>
<div class="chat-layout">
  <main id="view-room" class="chat-main view active" aria-label="Room chat">
    <ol id="messages" class="messages" aria-live="polite">
      {{range .Messages}}<li class="msg{{if eq .AuthorID $.MeID}} own{{end}}" data-id="{{.ID}}"><span class="meta"><span class="author">{{.AuthorName}}</span> <time data-created-at="{{.CreatedAt}}"></time></span> <span class="body">{{.Body}}</span></li>
      {{else}}<li class="empty">No messages yet — say hello.</li>{{end}}
    </ol>
    <div id="composer-error" class="composer-error" hidden></div>
    <form id="composer" class="composer">
      <textarea id="composer-input" rows="2" autofocus
                placeholder="Message #room — Enter to send, Shift+Enter for a new line"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <section id="view-dm" class="view view-dm" aria-label="Direct messages">
    <!-- The DMs view keeps the DM two-region layout the sidebar used to
         host: the conversation list on the left, the open conversation on
         the right. -->
    <aside class="dm-list-pane" aria-label="Conversations">
      <h2>Conversations</h2>
      <!-- app.js fills this with one row per direct-message correspondent,
           ordered by recency, with unread badges. Rows come from the private
           dm stream and from clicking an online user. -->
      <ul id="dm-list"></ul>
    </aside>
    <section id="dm" class="dm">
      <header class="dm-header">
        <!-- Mobile-only (under 720px, via style.css): returns the DMs view
             from the open conversation to the conversation list. -->
        <button id="dm-back" type="button">← Chats</button>
        <h2 id="dm-title">Direct messages</h2>
      </header>
      <ol id="dm-messages" class="messages" aria-live="polite">
        <li class="empty">Pick someone from the online list to chat privately.</li>
      </ol>
      <div id="dm-error" class="composer-error" hidden></div>
      <form id="dm-composer" class="composer">
        <textarea id="dm-input" rows="2" disabled
                  placeholder="Direct message — Enter to send, Shift+Enter for a new line"></textarea>
        <button id="dm-send" type="submit" disabled>Send</button>
      </form>
    </section>
  </section>
  <aside id="online" class="online" aria-label="Online users">
    <h2>Online</h2>
    <!-- app.js fills this from presence snapshots: the join reply and every
         "presence" stream event on the room topic. Clicking another user
         switches to the DMs view and opens (or creates) a direct-message
         conversation with them; your own entry does nothing. -->
    <ul id="online-list"></ul>
  </aside>
</div>
<!-- Mobile-only (under 720px, via style.css): the dim layer behind the
     online drawer; a tap closes it (app.js). -->
<div id="drawer-backdrop" aria-hidden="true"></div>
<script src="/static/app.js"></script>
</body>
</html>
